<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaloane Proiect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: one presentation card; a milestone track runs across the top, the active phase fills the stage, controls sit below. */
  :root {
    --bg: #eef2f7;
    --surface: #ffffff;
    --ink: #13213a;
    --muted: #5a6b85;
    --line: #d5dde9;
    --accent: #0056b3;
    --accent-soft: #e1ecf9;
    --on-accent: #ffffff;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1320; --surface: #141e30; --ink: #e8eef8; --muted: #93a3bd;
      --line: #263450; --accent: #4da3ff; --accent-soft: #1a2c48; --on-accent: #0c1320;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1320; --surface: #141e30; --ink: #e8eef8; --muted: #93a3bd;
    --line: #263450; --accent: #4da3ff; --accent-soft: #1a2c48; --on-accent: #0c1320;
    color-scheme: dark;
  }

  html { height: 100%; }
  html.embed { height: auto; }
  .embed body { min-height: 0; padding: 0; background: transparent; }
  .embed .back, .embed .hint { display: none; }
  body {
    min-height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: border-box; }

  .deck {
    width: 100%;
    max-width: 880px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brand strong { color: var(--ink); font-weight: 500; }

  .langs {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .langs button {
    font: 500 13px/1 var(--font-mono);
    letter-spacing: 0.08em;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .langs button:hover { color: var(--ink); }
  .langs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  /* Milestone track */
  .track {
    list-style: none;
    margin: 0;
    padding: 22px 24px 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    position: relative;
  }
  .track::before {
    content: "";
    position: absolute;
    left: calc(24px + 12.5% - 0px);
    right: calc(24px + 12.5%);
    top: calc(22px + 13px);
    height: 2px;
    background: var(--line);
  }
  .track .fill {
    position: absolute;
    left: calc(24px + (100% - 48px) / 8);
    top: calc(22px + 13px);
    height: 2px;
    background: var(--accent);
    transition: width 0.35s ease;
  }
  .track li { display: flex; justify-content: center; position: relative; }
  .track button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: none;
    border: 0;
    cursor: pointer;
    color: var(--muted);
    font: 500 12px/1.3 var(--font-body);
    padding: 0 4px;
    min-width: 0;
  }
  .track .dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: grid; place-items: center;
    font: 500 12px/1 var(--font-mono);
    background: var(--surface);
    border: 2px solid var(--line);
    color: var(--muted);
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .track button.done .dot { border-color: var(--accent); color: var(--accent); }
  .track button.current .dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .track button.current { color: var(--ink); }
  .track .label { text-align: center; text-wrap: balance; }

  main {
    padding: 40px 48px 44px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }
  .eyebrow {
    font: 500 13px/1 var(--font-mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.8rem, 4.2vw, 2.6rem);
    line-height: 1.12;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  main p {
    font-size: 1.15rem;
    line-height: 1.65;
    color: var(--muted);
    max-width: 58ch;
    margin: 0;
  }
  .reflect { margin-top: 6px; padding: 16px 18px; border-radius: 10px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 10px; }
  .reflect h2 { font: 500 12px/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .reflect label { font-weight: 500; line-height: 1.45; }
  .reflect textarea { font: 15px/1.5 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 84px; resize: vertical; width: 100%; }
  .reflect textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .reflect small { color: var(--muted); font-size: 12px; }
  .back { font: 500 13px/1 var(--font-mono); color: var(--accent); text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .stage { animation: enter 0.35s ease both; display: flex; flex-direction: column; gap: 14px; }
  .deliverables { margin-top: 14px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .deliverables h2 {
    font: 500 12px/1 var(--font-mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .deliverables ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 24px;
  }
  .deliverables li {
    display: flex;
    gap: 10px;
    align-items: baseline;
    line-height: 1.45;
    min-width: 0;
  }
  .deliverables li::before {
    content: "";
    flex: none;
    width: 8px; height: 8px;
    border-radius: 2px;
    background: var(--accent);
    transform: translateY(-1px) rotate(45deg);
  }
  @keyframes enter { from { opacity: 0.2; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-top: 1px solid var(--line);
    background: var(--accent-soft);
  }
  .nav {
    font: 500 15px/1 var(--font-body);
    border-radius: 8px;
    padding: 11px 18px;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--on-accent);
  }
  .nav.secondary { background: transparent; color: var(--accent); }
  .nav:disabled { opacity: 0.35; cursor: not-allowed; }
  .counter {
    font: 500 14px/1 var(--font-mono);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 12px; }

  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 560px) {
    header { padding: 14px 16px; }
    .track { padding: 18px 8px 0; }
    .track::before, .track .fill { top: calc(18px + 13px); }
    .track::before { left: calc(8px + 12.5%); right: calc(8px + 12.5%); }
    .track .fill { left: calc(8px + (100% - 16px) / 8); }
    .track .label { font-size: 11px; }
    main { padding: 28px 20px 32px; min-height: 260px; }
    main p { font-size: 1.02rem; }
    .deliverables ul { grid-template-columns: 1fr; }
    footer { padding: 14px 16px; }
    .nav { padding: 10px 14px; font-size: 14px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage { animation: none; }
    .track .fill { transition: none; }
  }
</style>
</head>
<body>

<div>
  <div class="deck" id="deck">
    <header>
      <div style="display:flex;flex-direction:column;gap:6px"><a class="back" id="back" href="./">← Lesson</a><div class="brand" id="brand"><strong>Jaloane</strong> Proiect</div></div>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" id="lang-fr" data-lang="fr" aria-pressed="false">FR</button>
        <button type="button" id="lang-ro" data-lang="ro" aria-pressed="true">RO</button>
      </div>
    </header>

    <ol class="track" id="track" aria-label="Phases">
      <div class="fill" id="fill" aria-hidden="true"></div>
    </ol>

    <main aria-live="polite">
      <div class="stage" id="stage">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="title"></h1>
        <p id="body"></p>
        <section class="deliverables" aria-labelledby="deliv-title">
          <h2 id="deliv-title">Deliverables</h2>
          <ul id="deliv-list"></ul>
        </section>
        <section class="reflect">
          <h2 id="reflect-title">Reflect</h2>
          <label for="reflect-note" id="reflect-q"></label>
          <textarea id="reflect-note"></textarea>
          <small id="reflect-saved"></small>
        </section>
      </div>
    </main>

    <footer>
      <button type="button" class="nav secondary" id="prev">&#9664; Back</button>
      <span class="counter" id="counter">1 / 4</span>
      <button type="button" class="nav" id="next">Next &#9654;</button>
    </footer>
  </div>
  <p class="hint" id="hint">Use ← → to move between phases</p>
</div>

<script>
  if (window.top !== window.self) document.documentElement.classList.add("embed");

  const slides = [
    {
      en: { short: "Requirements", title: "Requirements Engineering", body: "Gathering and defining the business analysis requirements for the interactive software environment.", deliverables: ["Stakeholder interview summary", "Business requirements document (BRD)", "Use cases and user stories", "Prioritised requirements list (MoSCoW)"] },
      fr: { short: "Exigences", title: "Ingénierie des Exigences", body: "Collecte et définition des exigences de l'analyse métier pour l'environnement logiciel interactif.", deliverables: ["Synthèse des entretiens avec les parties prenantes", "Cahier des exigences métier", "Cas d'utilisation et user stories", "Liste priorisée des exigences (MoSCoW)"] },
      ro: { short: "Cerințe", title: "Ingineria Cerințelor", body: "Colectarea și definirea cerințelor de analiză de business pentru mediul software interactiv.", deliverables: ["Sinteza interviurilor cu părțile interesate", "Documentul cerințelor de business (BRD)", "Cazuri de utilizare și user stories", "Lista prioritizată a cerințelor (MoSCoW)"] }
    },
    {
      en: { short: "Design", title: "System Design", body: "Mapping the conceptual network and defining the user experience (UX) framework for the application.", deliverables: ["Concept map and information architecture", "Wireframes and clickable prototype", "UX framework and style guide", "System architecture diagram"] },
      fr: { short: "Conception", title: "Conception du Système", body: "Cartographie du réseau conceptuel et définition du cadre de l'expérience utilisateur (UX) pour l'application.", deliverables: ["Carte conceptuelle et architecture de l'information", "Maquettes fonctionnelles et prototype cliquable", "Cadre UX et guide de style", "Schéma d'architecture du système"] },
      ro: { short: "Proiectare", title: "Proiectarea Sistemului", body: "Cartografierea rețelei conceptuale și definirea cadrului experienței utilizatorului (UX) pentru aplicație.", deliverables: ["Hartă conceptuală și arhitectura informației", "Wireframe-uri și prototip interactiv", "Cadrul UX și ghidul de stil", "Diagrama arhitecturii sistemului"] }
    },
    {
      en: { short: "Development", title: "Development & Implementation", body: "Translating the proposed software engineering models into actionable code and interactive modules.", deliverables: ["Working interactive modules", "Version-controlled source code repository", "Unit and integration tests", "Technical documentation"] },
      fr: { short: "Développement", title: "Développement et Mise en Œuvre", body: "Traduction des modèles d'ingénierie logicielle proposés en code exploitable et modules interactifs.", deliverables: ["Modules interactifs fonctionnels", "Dépôt de code source versionné", "Tests unitaires et d'intégration", "Documentation technique"] },
      ro: { short: "Dezvoltare", title: "Dezvoltare și Implementare", body: "Transpunerea modelelor de inginerie software propuse în cod acționabil și module interactive.", deliverables: ["Module interactive funcționale", "Depozit de cod sursă versionat", "Teste unitare și de integrare", "Documentație tehnică"] }
    },
    {
      en: { short: "Go-Live", title: "Evaluation & Go-Live", body: "Testing the interactive system against the initial business case and deploying the final platform.", deliverables: ["User acceptance testing (UAT) report", "Evaluation against the business case", "Deployed production platform", "User guide and project handover"] },
      fr: { short: "Lancement", title: "Évaluation et Lancement", body: "Test du système interactif par rapport au cas d'utilisation initial et déploiement de la plateforme finale.", deliverables: ["Rapport de recette utilisateur (UAT)", "Évaluation par rapport au cas d'utilisation", "Plateforme déployée en production", "Guide utilisateur et passation du projet"] },
      ro: { short: "Lansare", title: "Evaluare și Lansare", body: "Testarea sistemului interactiv în raport cu analiza de business inițială și lansarea platformei finale.", deliverables: ["Raportul testelor de acceptanță (UAT)", "Evaluarea în raport cu analiza de business", "Platforma lansată în producție", "Ghidul utilizatorului și predarea proiectului"] }
    }
  ];

  const questions = [{"en": "Which requirement would you clarify first with the client, and why?", "fr": "Quelle exigence clarifieriez-vous d'abord avec le client, et pourquoi ?", "ro": "Ce cerință ai clarifica prima cu clientul și de ce?"}, {"en": "Which deliverable would you show the client first, to check you understood them?", "fr": "Quel livrable montreriez-vous d'abord au client pour vérifier que vous l'avez compris ?", "ro": "Ce livrabil i-ai arăta primul clientului, ca să verifici că l-ai înțeles?"}, {"en": "What could delay this phase, and how would you notice it early?", "fr": "Qu'est-ce qui pourrait retarder cette phase, et comment le remarqueriez-vous tôt ?", "ro": "Ce ar putea întârzia această fază și cum ai observa din timp?"}, {"en": "How do you know the project is really finished?", "fr": "Comment savez-vous que le projet est vraiment terminé ?", "ro": "De unde știi că proiectul este cu adevărat terminat?"}];

  const ui = {
    en: { phase: "Phase", of: "of", prev: "◀ Back", next: "Next ▶", hint: "Use ← → to move between phases", brand: "<strong>Project</strong> Milestones", track: "Phases", deliv: "Deliverables", reflect: "Reflect", ph: "Your notes…", saved: "Saved only in this browser. Nobody else sees it.", back: "← Lesson" },
    fr: { phase: "Phase", of: "sur", prev: "◀ Retour", next: "Suivant ▶", hint: "Utilisez ← → pour changer de phase", brand: "<strong>Jalons</strong> du Projet", track: "Phases", deliv: "Livrables", reflect: "Réflexion", ph: "Vos notes…", saved: "Enregistré uniquement dans ce navigateur. Personne d'autre ne le voit.", back: "← Leçon" },
    ro: { phase: "Faza", of: "din", prev: "◀ Înapoi", next: "Înainte ▶", hint: "Folosiți ← → pentru a schimba faza", brand: "<strong>Jaloane</strong> Proiect", track: "Faze", deliv: "Livrabile", reflect: "Reflecție", ph: "Notițele tale…", saved: "Salvat doar în acest browser. Nimeni altcineva nu le vede.", back: "← Lecția" }
  };

  let current = 0;
  let lang = "ro";
  try { const saved = localStorage.getItem("jaloane-lang"); if (saved && ui[saved]) lang = saved; } catch (e) {}

  const $ = id => document.getElementById(id);
  const track = $("track");

  slides.forEach((_, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.id = "phase-" + (i + 1);
    b.innerHTML = '<span class="dot">' + (i + 1) + '</span><span class="label"></span>';
    b.addEventListener("click", () => go(i));
    li.appendChild(b);
    track.appendChild(li);
  });

  function render(animate) {
    const s = slides[current][lang];
    const t = ui[lang];
    document.documentElement.lang = lang;
    $("brand").innerHTML = t.brand;
    $("eyebrow").textContent = t.phase + " " + (current + 1) + " " + t.of + " " + slides.length;
    $("title").textContent = s.title;
    $("body").textContent = s.body;
    $("deliv-title").textContent = t.deliv;
    $("reflect-title").textContent = t.reflect;
    $("reflect-q").textContent = questions[current][lang];
    $("reflect-saved").textContent = t.saved;
    $("back").textContent = t.back;
    const note = $("reflect-note");
    note.placeholder = t.ph;
    let saved = "";
    try { saved = localStorage.getItem("jaloane-reflect-" + current) || ""; } catch (e) {}
    if (document.activeElement !== note) note.value = saved;
    const list = $("deliv-list");
    list.replaceChildren(...s.deliverables.map(d => {
      const li = document.createElement("li");
      li.textContent = d;
      return li;
    }));
    $("counter").textContent = (current + 1) + " / " + slides.length;
    $("prev").textContent = t.prev;
    $("next").textContent = t.next;
    $("hint").textContent = t.hint;
    $("prev").disabled = current === 0;
    $("next").disabled = current === slides.length - 1;
    track.setAttribute("aria-label", t.track);

    track.querySelectorAll("li button").forEach((b, i) => {
      b.querySelector(".label").textContent = slides[i][lang].short;
      b.classList.toggle("done", i < current);
      b.classList.toggle("current", i === current);
      b.setAttribute("aria-current", i === current ? "step" : "false");
    });
    $("fill").style.width = "calc((100% - " + (getComputedStyle(track).paddingLeft) + " * 2) * " + (current / slides.length) + ")";

    document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

    if (animate) {
      const stage = $("stage");
      stage.style.animation = "none";
      void stage.offsetWidth;
      stage.style.animation = "";
    }
  }

  function go(i) {
    if (i < 0 || i >= slides.length || i === current) return;
    current = i;
    render(true);
  }

  $("prev").addEventListener("click", () => go(current - 1));
  $("next").addEventListener("click", () => go(current + 1));
  document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("jaloane-lang", lang); } catch (e) {}
    render(false);
  }));
  $("reflect-note").addEventListener("input", e => {
    try { localStorage.setItem("jaloane-reflect-" + current, e.target.value); } catch (err) {}
  });
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("textarea, input")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") go(current + 1);
    else if (e.key === "ArrowLeft" || e.key === "PageUp") go(current - 1);
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(slides.length - 1);
  });
  window.addEventListener("resize", () => render(false));
  // The lesson page shares this key, so a language switch there updates this page too.
  window.addEventListener("storage", e => {
    if (e.key === "jaloane-lang" && ui[e.newValue] && e.newValue !== lang) { lang = e.newValue; render(false); }
  });

  render(false);
</script>
</body>
</html>
